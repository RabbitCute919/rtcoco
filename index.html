<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังสรุปและข้อสอบรายวิชา</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SortableJS สำหรับลากวางด้วยนิ้วบน iPad/มือถือ -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .sortable-ghost {
            opacity: 0.3;
            background-color: #e0e7ff !important;
            border: 2px dashed #6366f1 !important;
        }
        .drag-handle {
            touch-action: none;
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center py-2 md:py-4">
            <div id="syncStatus" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-200 text-slate-700 text-xs font-semibold mb-2">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span> กำลังซิงก์กับ Google Drive...
            </div>
            <h1 class="text-2xl md:text-4xl font-bold text-indigo-700">📚 คลังรวมสรุป & ข้อสอบ</h1>
            <p class="text-slate-500 text-xs md:text-sm mt-1">แตะลากเพื่อจัดลำดับได้สะดวกรวดเร็ว</p>
        </header>

        <!-- ฟอร์มเพิ่มวิชาใหม่ -->
        <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold text-slate-700 flex items-center gap-1.5">
                    <span>➕</span> เพิ่มวิชาใหม่เข้าคลัง
                </h2>
                <button onclick="openCategoryModal()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                    ⚙️ จัดการ/จัดลำดับสัดส่วน
                </button>
            </div>
            
            <div class="flex flex-col md:flex-row gap-2">
                <select id="newSubjectCategory" class="px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm font-medium md:w-52">
                </select>

                <input id="newSubjectInput" type="text" placeholder="พิมพ์ชื่อหัวข้อ..." 
                       class="flex-1 px-4 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                
                <button onclick="addSubject()" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-xl font-medium transition text-sm flex items-center justify-center gap-1 shadow-sm">
                    + เพิ่มวิชา
                </button>
            </div>
        </div>

        <!-- แถบกรองสัดส่วน (Filter Tabs) -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none" id="categoryFilterBar">
        </div>

        <!-- รายการวิชา (รองรับ Drag & Drop) -->
        <div id="subjectList" class="space-y-4">
            <div class="text-center py-12 text-slate-400">กำลังดาวน์โหลดข้อมูลจาก Google Drive...</div>
        </div>

    </div>

    <!-- Modal 1: จัดการสัดส่วน (Drag & Drop) -->
    <div id="categoryModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-5 md:p-6 rounded-2xl max-w-md w-full shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-800">⚙️ จัดการ & จัดลำดับสัดส่วน</h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            
            <div class="flex gap-2">
                <input id="customCategoryInput" type="text" placeholder="ชื่อสัดส่วนใหม่..." 
                       class="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addNewCategory()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">
                    เพิ่ม
                </button>
            </div>

            <p class="text-[11px] text-slate-400 flex items-center gap-1">
                <span>✋</span> แตะค้างที่แถบ <b>☰</b> แล้วลากเพื่อสลับลำดับได้ทันที
            </p>

            <div class="space-y-1.5 max-h-64 overflow-y-auto pr-1" id="categoryManagerList">
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="closeCategoryModal()" class="px-5 py-2 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium">
                    ปิดหน้าต่าง
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 2: เพิ่มลิงก์ -->
    <div id="linkModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-800">🔗 เพิ่มลิงก์บทเรียน</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            <input type="hidden" id="modalSubjectId">
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">เลือกประเภท</label>
                <select id="modalLinkType" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    <option value="summary">📝 สรุปเนื้อหา / เลกเชอร์</option>
                    <option value="exam">🎯 ข้อสอบ / แนวข้อสอบ / ควิซ</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อลิงก์ / คำอธิบาย</label>
                <input id="modalLinkTitle" type="text" placeholder="เช่น สรุปบทที่ 1, ตะลุยโจทย์ปลายภาค" 
                       class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">URL (ลิงก์ปลายทาง)</label>
                <input id="modalLinkUrl" type="url" placeholder="https://drive.google.com/..." 
                       class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-xl">ยกเลิก</button>
                <button onclick="saveLink()" class="px-5 py-2 text-sm bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-medium shadow-sm">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyY7M6fdlwe0ed5ULzGasGz55jFfohm9JhtA08lf4ZlygUoV61czcMuTWAcmm6fbATO/exec";

        let categories = ['สรีรวิทยา', 'พยาธิวิทยา', 'เทคโนโลยี', 'ชีวะรังสีเทคนิค', 'ฟิสิกส์รังสี'];
        let subjects = [];
        let currentFilter = 'ทั้งหมด';

        function updateSyncStatus(status, text) {
            const el = document.getElementById('syncStatus');
            if (status === 'syncing') {
                el.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 text-amber-700 text-xs font-semibold mb-2";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span> ${text}`;
            } else if (status === 'success') {
                el.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 text-xs font-semibold mb-2";
                el.innerHTML = `🟢 ${text}`;
            } else {
                el.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-rose-100 text-rose-700 text-xs font-semibold mb-2";
                el.innerHTML = `🔴 ${text}`;
            }
        }

        async function loadDataFromGoogleDrive() {
            try {
                updateSyncStatus('syncing', 'กำลังโหลดข้อมูลจาก Google Drive...');
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();
                
                if (data.categories) categories = data.categories;
                if (data.subjects) subjects = data.subjects;

                updateSyncStatus('success', 'เชื่อมต่อกับ Google Drive สำเร็จ');
                render();
            } catch (err) {
                console.error(err);
                updateSyncStatus('error', 'โหลดข้อมูลล้มเหลว (ใช้ออฟไลน์)');
                categories = JSON.parse(localStorage.getItem('study_vault_categories')) || categories;
                subjects = JSON.parse(localStorage.getItem('study_vault_v4')) || [];
                render();
            }
        }

        async function saveData() {
            localStorage.setItem('study_vault_categories', JSON.stringify(categories));
            localStorage.setItem('study_vault_v4', JSON.stringify(subjects));

            try {
                updateSyncStatus('syncing', 'กำลังบันทึกลง Google Drive...');
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ categories, subjects })
                });
                updateSyncStatus('success', 'บันทึกลง Google Drive แล้ว');
            } catch (err) {
                console.error(err);
                updateSyncStatus('error', 'เกิดข้อผิดพลาดในการบันทึก');
            }
        }

        // --- จัดการสัดส่วน ---
        function openCategoryModal() {
            document.getElementById('customCategoryInput').value = '';
            renderCategoryManagerList();
            document.getElementById('categoryModal').classList.remove('hidden');
            document.getElementById('categoryModal').classList.add('flex');
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.add('hidden');
            document.getElementById('categoryModal').classList.remove('flex');
            render();
        }

        function addNewCategory() {
            const input = document.getElementById('customCategoryInput');
            const name = input.value.trim();
            if (!name) return;
            if (categories.includes(name)) {
                alert('มีสัดส่วนนี้อยู่แล้ว');
                return;
            }
            categories.push(name);
            input.value = '';
            saveData();
            renderCategoryManagerList();
        }

        function deleteCategory(catName) {
            if (confirm(`ต้องการลบสัดส่วน "${catName}" ใช่หรือไม่?`)) {
                categories = categories.filter(c => c !== catName);
                if (currentFilter === catName) currentFilter = 'ทั้งหมด';
                saveData();
                renderCategoryManagerList();
            }
        }

        function renderCategoryManagerList() {
            const list = document.getElementById('categoryManagerList');
            if (categories.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 italic py-2 text-center">ยังไม่มีสัดส่วน เพิ่มด้านบนได้เลย</p>`;
                return;
            }
            list.innerHTML = categories.map((cat, idx) => `
                <div data-id="${cat}" class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm transition">
                    <div class="flex items-center gap-2 truncate flex-1">
                        <span class="drag-handle text-slate-400 hover:text-indigo-600 px-1 py-0.5 select-none text-base">☰</span>
                        <span class="font-medium text-slate-700 truncate">🏷️ ${cat}</span>
                    </div>
                    <button onclick="deleteCategory('${cat}')" class="text-rose-500 hover:bg-rose-50 px-2 py-1 rounded text-xs font-medium">ลบ</button>
                </div>
            `).join('');

            // ผูก SortableJS ให้ลากสลับหมวดหมู่ได้
            new Sortable(list, {
                handle: '.drag-handle',
                animation: 200,
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    const newOrder = Array.from(list.children).map(item => item.getAttribute('data-id'));
                    categories = newOrder.filter(Boolean);
                    saveData();
                }
            });
        }

        // --- เพิ่ม/ลบวิชาและลิงก์ ---
        function addSubject() {
            const input = document.getElementById('newSubjectInput');
            const catSelect = document.getElementById('newSubjectCategory');
            const name = input.value.trim();
            const category = catSelect.value || (categories[0] || 'ทั่วไป');

            if (!name) {
                alert('กรุณากรอกชื่อวิชา');
                return;
            }

            subjects.unshift({
                id: "sub_" + Date.now().toString(),
                category: category,
                name: name,
                summaries: [],
                exams: []
            });

            input.value = '';
            saveData();
            render();
        }

        function deleteSubject(id) {
            if (confirm('คุณต้องการลบวิชานี้และข้อมูลลิงก์ทั้งหมดใช่หรือไม่?')) {
                subjects = subjects.filter(s => s.id !== id);
                saveData();
                render();
            }
        }

        function openAddLinkModal(subjectId) {
            document.getElementById('modalSubjectId').value = subjectId;
            document.getElementById('modalLinkTitle').value = '';
            document.getElementById('modalLinkUrl').value = '';
            document.getElementById('linkModal').classList.remove('hidden');
            document.getElementById('linkModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('linkModal').classList.add('hidden');
            document.getElementById('linkModal').classList.remove('flex');
        }

        function saveLink() {
            const id = document.getElementById('modalSubjectId').value;
            const type = document.getElementById('modalLinkType').value;
            const title = document.getElementById('modalLinkTitle').value.trim();
            let url = document.getElementById('modalLinkUrl').value.trim();

            if (!title || !url) {
                alert('กรุณากรอกชื่อและ URL ให้ครบถ้วน');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const subject = subjects.find(s => s.id === id);
            if (subject) {
                if (!subject.summaries) subject.summaries = [];
                if (!subject.exams) subject.exams = [];

                if (type === 'summary') {
                    subject.summaries.push({ title, url });
                } else {
                    subject.exams.push({ title, url });
                }
                saveData();
                render();
                closeModal();
            }
        }

        function deleteLink(subjectId, type, index) {
            const subject = subjects.find(s => s.id === subjectId);
            if (subject) {
                if (type === 'summary') subject.summaries.splice(index, 1);
                if (type === 'exam') subject.exams.splice(index, 1);
                saveData();
                render();
            }
        }

        function setFilter(cat) {
            currentFilter = cat;
            render();
        }

        // --- Render หน้าจอ & ผูกระบบ Drag & Drop ---
        function render() {
            const catSelect = document.getElementById('newSubjectCategory');
            if (categories.length === 0) {
                catSelect.innerHTML = `<option value="ทั่วไป">📌 ทั่วไป</option>`;
            } else {
                catSelect.innerHTML = categories.map(cat => `<option value="${cat}">📌 ${cat}</option>`).join('');
            }

            const filterBar = document.getElementById('categoryFilterBar');
            const allFilters = ['ทั้งหมด', ...categories];
            filterBar.innerHTML = allFilters.map(cat => {
                const isActive = currentFilter === cat;
                return `
                    <button onclick="setFilter('${cat}')" 
                            class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
                                isActive 
                                ? 'bg-indigo-600 text-white shadow-sm' 
                                : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-200'
                            }">
                        ${cat}
                    </button>
                `;
            }).join('');

            const container = document.getElementById('subjectList');
            const filteredSubjects = currentFilter === 'ทั้งหมด' 
                ? subjects 
                : subjects.filter(s => s.category === currentFilter);

            if (filteredSubjects.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 p-8">
                        <p class="text-3xl mb-2">📂</p>
                        <p class="text-slate-500 font-medium">ยังไม่มีรายวิชาในสัดส่วนนี้</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredSubjects.map((sub) => `
                <div data-id="${sub.id}" class="subject-card bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition hover:shadow-md">
                    <div class="p-3 md:p-4 bg-slate-50/80 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
                        <div class="flex items-center gap-2">
                            <span class="subject-handle drag-handle text-slate-400 hover:text-indigo-600 px-1 py-0.5 select-none text-lg">☰</span>
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-indigo-100 text-indigo-700">
                                ${sub.category || 'ทั่วไป'}
                            </span>
                            <h2 class="font-bold text-sm md:text-base text-slate-800">${sub.name}</h2>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="openAddLinkModal('${sub.id}')" 
                                    class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition">
                                <span>+</span> เพิ่มลิงก์
                            </button>
                            <button onclick="deleteSubject('${sub.id}')" 
                                    class="text-xs text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="ลบวิชา">
                                🗑️
                            </button>
                        </div>
                    </div>
                    
                    <div class="p-3 md:p-4 grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                        <!-- สรุป -->
                        <div class="space-y-2 bg-emerald-50/40 p-3 rounded-xl border border-emerald-100/70">
                            <div class="flex items-center justify-between text-xs font-bold text-emerald-700 uppercase">
                                <span>📝 สรุปเนื้อหา / เลกเชอร์</span>
                                <span class="bg-emerald-200/60 px-1.5 py-0.5 rounded text-[10px]">${(sub.summaries || []).length} ลิงก์</span>
                            </div>
                            <div id="summaries_${sub.id}" class="space-y-1.5">
                                ${(sub.summaries && sub.summaries.length) ? sub.summaries.map((item, idx) => `
                                    <div data-index="${idx}" class="flex items-center justify-between p-2 rounded-lg bg-white hover:bg-emerald-50 border border-emerald-100 transition shadow-2xs gap-1">
                                        <span class="link-handle drag-handle text-slate-300 hover:text-emerald-600 px-1 select-none text-xs">☰</span>
                                        <a href="${item.url}" target="_blank" class="text-xs md:text-sm text-slate-700 hover:text-emerald-700 truncate flex-1 font-medium">
                                            📄 ${item.title}
                                        </a>
                                        <button onclick="deleteLink('${sub.id}', 'summary', ${idx})" class="text-slate-300 hover:text-rose-500 ml-1 text-xs">✕</button>
                                    </div>
                                `).join('') : '<p class="text-xs text-slate-400 italic py-1">ยังไม่มีลิงก์สรุป</p>'}
                            </div>
                        </div>

                        <!-- ข้อสอบ -->
                        <div class="space-y-2 bg-amber-50/40 p-3 rounded-xl border border-amber-100/70">
                            <div class="flex items-center justify-between text-xs font-bold text-amber-700 uppercase">
                                <span>🎯 ข้อสอบ / แนวข้อสอบ</span>
                                <span class="bg-amber-200/60 px-1.5 py-0.5 rounded text-[10px]">${(sub.exams || []).length} ลิงก์</span>
                            </div>
                            <div id="exams_${sub.id}" class="space-y-1.5">
                                ${(sub.exams && sub.exams.length) ? sub.exams.map((item, idx) => `
                                    <div data-index="${idx}" class="flex items-center justify-between p-2 rounded-lg bg-white hover:bg-amber-50 border border-amber-100 transition shadow-2xs gap-1">
                                        <span class="link-handle drag-handle text-slate-300 hover:text-amber-600 px-1 select-none text-xs">☰</span>
                                        <a href="${item.url}" target="_blank" class="text-xs md:text-sm text-slate-700 hover:text-amber-800 truncate flex-1 font-medium">
                                            ✏️ ${item.title}
                                        </a>
                                        <button onclick="deleteLink('${sub.id}', 'exam', ${idx})" class="text-slate-300 hover:text-rose-500 ml-1 text-xs">✕</button>
                                    </div>
                                `).join('') : '<p class="text-xs text-slate-400 italic py-1">ยังไม่มีลิงก์ข้อสอบ</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // ผูก Sortable ให้รายการวิชา
            new Sortable(container, {
                handle: '.subject-handle',
                animation: 200,
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    const orderedIds = Array.from(container.children).map(c => c.getAttribute('data-id'));
                    if (currentFilter === 'ทั้งหมด') {
                        subjects.sort((a, b) => orderedIds.indexOf(a.id) - orderedIds.indexOf(b.id));
                    }
                    saveData();
                }
            });

            // ผูก Sortable ให้ทุกลิงก์สรุปและข้อสอบ
            filteredSubjects.forEach(sub => {
                const sumContainer = document.getElementById(`summaries_${sub.id}`);
                if (sumContainer) {
                    new Sortable(sumContainer, {
                        handle: '.link-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: function () {
                            const newIndices = Array.from(sumContainer.children).map(c => parseInt(c.getAttribute('data-index')));
                            sub.summaries = newIndices.map(i => sub.summaries[i]).filter(Boolean);
                            saveData();
                        }
                    });
                }

                const examContainer = document.getElementById(`exams_${sub.id}`);
                if (examContainer) {
                    new Sortable(examContainer, {
                        handle: '.link-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: function () {
                            const newIndices = Array.from(examContainer.children).map(c => parseInt(c.getAttribute('data-index')));
                            sub.exams = newIndices.map(i => sub.exams[i]).filter(Boolean);
                            saveData();
                        }
                    });
                }
            });
        }

        loadDataFromGoogleDrive();
    </script>
</body>
</html>
