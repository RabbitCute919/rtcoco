<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังสรุปและข้อสอบรายวิชา</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="text-center py-4">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 text-xs font-semibold mb-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ซิงก์ข้อมูลคลาวด์สด (Realtime)
            </div>
            <h1 class="text-3xl font-bold text-indigo-700">📚 คลังรวมสรุป & ข้อสอบ</h1>
            <p class="text-slate-500 mt-1">ข้อมูลเชื่อมต่อกันทุกอุปกรณ์ เพิ่มในคอมฯ ก็เปิดดูบนมือถือได้ทันที</p>
        </header>

        <!-- ฟอร์มเพิ่มวิชา -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex gap-2">
            <input id="newSubjectInput" type="text" placeholder="พิมพ์ชื่อวิชาใหม่ที่ต้องการเพิ่ม..." 
                   class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="addSubject()" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-medium transition">
                + เพิ่มวิชา
            </button>
        </div>

        <!-- รายการวิชา -->
        <div id="subjectList" class="space-y-4">
            <div class="text-center py-10 text-slate-400">กำลังโหลดข้อมูลจาก Firebase...</div>
        </div>
    </div>

    <!-- Modal เพิ่มลิงก์ -->
    <div id="linkModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl max-w-md w-full shadow-lg space-y-4">
            <h3 class="text-lg font-bold text-slate-800">เพิ่มลิงก์ใหม่</h3>
            <input type="hidden" id="modalSubjectId">
            
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">ประเภทลิงก์</label>
                <select id="modalLinkType" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="summary">📝 ลิงก์สรุปเนื้อหา</option>
                    <option value="exam">🎯 ลิงก์ข้อสอบ / แบบฝึกหัด</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">ชื่อหัวข้อ / คำอธิบาย</label>
                <input id="modalLinkTitle" type="text" placeholder="เช่น สรุปบทที่ 1, ตะลุยโจทย์" 
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">URL (ลิงก์)</label>
                <input id="modalLinkUrl" type="url" placeholder="https://..." 
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">ยกเลิก</button>
                <button onclick="saveLink()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // ⚠️ วางค่า config ของคุณจาก Firebase ตรงนี้
        // ----------------------------------------------------
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_DATABASE_NAME.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // เริ่มต้นเชื่อมต่อ Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const subjectsRef = db.ref('subjects');

        let subjects = [];

        // ฟังการเปลี่ยนแปลงข้อมูลแบบ Real-time
        subjectsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // แปลง object จาก Firebase ให้เป็น Array
                subjects = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                }));
            } else {
                subjects = [];
            }
            render();
        });

        function addSubject() {
            const input = document.getElementById('newSubjectInput');
            const name = input.value.trim();
            if (!name) return;

            subjectsRef.push({
                name: name,
                summaries: [],
                exams: []
            });
            input.value = '';
        }

        function deleteSubject(id) {
            if (confirm('ต้องการลบวิชานี้และลิงก์ทั้งหมดใช่หรือไม่?')) {
                db.ref(`subjects/${id}`).remove();
            }
        }

        function openAddLinkModal(subjectId) {
            document.getElementById('modalSubjectId').value = subjectId;
            document.getElementById('modalLinkTitle').value = '';
            document.getElementById('modalLinkUrl').value = '';
            document.getElementById('linkModal').classList.remove('hidden');
            document.getElementById('linkModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('linkModal').classList.add('hidden');
            document.getElementById('linkModal').classList.remove('flex');
        }

        function saveLink() {
            const id = document.getElementById('modalSubjectId').value;
            const type = document.getElementById('modalLinkType').value;
            const title = document.getElementById('modalLinkTitle').value.trim();
            let url = document.getElementById('modalLinkUrl').value.trim();

            if (!title || !url) {
                alert('กรุณากรอกชื่อและ URL ให้ครบถ้วน');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const subject = subjects.find(s => s.id === id);
            if (subject) {
                const targetList = type === 'summary' 
                    ? (subject.summaries || []) 
                    : (subject.exams || []);
                
                targetList.push({ title, url });

                db.ref(`subjects/${id}/${type === 'summary' ? 'summaries' : 'exams'}`).set(targetList);
                closeModal();
            }
        }

        function deleteLink(subjectId, type, index) {
            const subject = subjects.find(s => s.id === subjectId);
            if (subject) {
                const field = type === 'summary' ? 'summaries' : 'exams';
                const targetList = subject[field] || [];
                targetList.splice(index, 1);
                
                db.ref(`subjects/${subjectId}/${field}`).set(targetList);
            }
        }

        function render() {
            const container = document.getElementById('subjectList');
            if (subjects.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400">ยังไม่มีรายวิชา เริ่มต้นเพิ่มวิชาแรกของคุณด้านบนได้เลย!</div>`;
                return;
            }

            container.innerHTML = subjects.map(sub => {
                const summaries = sub.summaries || [];
                const exams = sub.exams || [];

                return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                        <h2 class="font-bold text-lg text-slate-800">${sub.name}</h2>
                        <div class="flex gap-2">
                            <button onclick="openAddLinkModal('${sub.id}')" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-medium px-3 py-1.5 rounded-lg">
                                + เพิ่มลิงก์
                            </button>
                            <button onclick="deleteSubject('${sub.id}')" class="text-xs text-rose-500 hover:bg-rose-50 px-2 py-1.5 rounded-lg">
                                ลบวิชา
                            </button>
                        </div>
                    </div>
                    
                    <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- โซนสรุป -->
                        <div class="space-y-2">
                            <div class="flex items-center gap-1.5 text-xs font-semibold text-emerald-600 uppercase">
                                <span>📝 สรุปเนื้อหา</span>
                            </div>
                            <div class="space-y-1.5">
                                ${summaries.length ? summaries.map((item, idx) => `
                                    <div class="group flex items-center justify-between p-2 rounded-lg bg-emerald-50/50 hover:bg-emerald-50 border border-emerald-100">
                                        <a href="${item.url}" target="_blank" class="text-sm text-slate-700 hover:text-emerald-700 truncate flex-1 font-medium">🔗 ${item.title}</a>
                                        <button onclick="deleteLink('${sub.id}', 'summary', ${idx})" class="text-slate-400 hover:text-rose-500 ml-2 text-xs">✕</button>
                                    </div>
                                `).join('') : '<p class="text-xs text-slate-400 italic">ยังไม่มีลิงก์สรุป</p>'}
                            </div>
                        </div>

                        <!-- โซนข้อสอบ -->
                        <div class="space-y-2">
                            <div class="flex items-center gap-1.5 text-xs font-semibold text-amber-600 uppercase">
                                <span>🎯 ข้อสอบ & แบบฝึกหัด</span>
                            </div>
                            <div class="space-y-1.5">
                                ${exams.length ? exams.map((item, idx) => `
                                    <div class="group flex items-center justify-between p-2 rounded-lg bg-amber-50/50 hover:bg-amber-50 border border-amber-100">
                                        <a href="${item.url}" target="_blank" class="text-sm text-slate-700 hover:text-amber-800 truncate flex-1 font-medium">🔗 ${item.title}</a>
                                        <button onclick="deleteLink('${sub.id}', 'exam', ${idx})" class="text-slate-400 hover:text-rose-500 ml-2 text-xs">✕</button>
                                    </div>
                                `).join('') : '<p class="text-xs text-slate-400 italic">ยังไม่มีลิงก์ข้อสอบ</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
    </script>
</body>
</html>
