<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังสรุป & ข้อสอบรายวิชา</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SortableJS สำหรับลากสลับลำดับ -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .sortable-ghost {
            opacity: 0.35;
            background-color: #ede9fe !important;
            border: 2px dashed #6366f1 !important;
        }
        .drag-handle {
            touch-action: none;
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16 antialiased">

    <!-- แถบ Header ด้านบนสุด -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl shadow-indigo-100 shadow-md">
                    📚
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold text-slate-900 leading-tight">คลังสรุป & ข้อสอบ</h1>
                    <div id="syncStatus" class="flex items-center gap-1.5 text-[11px] text-slate-500 font-medium">
                        <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span> กำลังเชื่อมต่อ Google Drive...
                    </div>
                </div>
            </div>

            <!-- ปุ่มเปิดหน้าต่างเพิ่มวิชาใหม่ -->
            <div class="flex items-center gap-2">
                <button onclick="openCategoryModal()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-xl flex items-center gap-1.5 transition">
                    ⚙️ จัดการชั้นปี
                </button>
                <button onclick="openAddSubjectModal()" class="text-xs md:text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-sm shadow-indigo-200 transition">
                    <span>➕</span> เพิ่มวิชาใหม่
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

        <!-- แถบเลือกชั้นปี (Year Tabs Selector) ดีไซน์ใหม่ สวย ชัดเจน -->
        <div class="bg-white p-2 rounded-2xl border border-slate-200 shadow-xs">
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none" id="yearTabBar">
                <!-- ปุ่มเลือกชั้นปีจะ render ตรงนี้ -->
            </div>
        </div>

        <!-- แถบสถิติย่อ & ค้นหาด่วน (Quick Search & Stats) -->
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
            <div id="statsSummary" class="text-xs text-slate-500 font-medium flex items-center gap-3 px-1">
                <!-- สถิติจะแสดงที่นี่ -->
            </div>
            <div class="relative flex-1 sm:max-w-xs">
                <input id="searchInput" type="text" oninput="render()" placeholder="🔍 ค้นหาวิชา หรือ ลิงก์สรุป..." 
                       class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-2xs">
                <span class="absolute left-3 top-2.5 text-slate-400 text-xs">🔍</span>
            </div>
        </div>

        <!-- รายการวิชาทั้งหมด (Card Grid/List) -->
        <div id="subjectList" class="space-y-4">
            <div class="text-center py-16 bg-white rounded-3xl border border-dashed border-slate-200 text-slate-400">
                <p class="text-3xl mb-2">⏳</p>
                <p class="text-sm font-medium">กำลังดาวน์โหลดข้อมูลล่าสุดจาก Google Drive...</p>
            </div>
        </div>

    </main>

    <!-- Modal 1: เพิ่มวิชาใหม่ (Pop-up สวยงาม ไม่รกหน้าหลัก) -->
    <div id="addSubjectModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-3xl max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <span>➕</span> เพิ่มวิชาใหม่
                </h3>
                <button onclick="closeAddSubjectModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">เลือกชั้นปี / หมวดหมู่</label>
                    <select id="modalAddSubjectCategory" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm font-medium">
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">ชื่อวิชา / หัวข้อบทเรียน</label>
                    <input id="modalAddSubjectName" type="text" placeholder="เช่น สรีรวิทยา 1, รังสีเทคนิค..." 
                           class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeAddSubjectModal()" class="px-4 py-2.5 text-sm text-slate-600 hover:bg-slate-100 rounded-xl font-medium">ยกเลิก</button>
                <button onclick="confirmAddSubject()" class="px-5 py-2.5 text-sm bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-medium shadow-sm">เพิ่มวิชา</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: เพิ่มลิงก์สรุป & ข้อสอบ -->
    <div id="linkModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-3xl max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <span>🔗</span> เพิ่มลิงก์เนื้อหา
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            <input type="hidden" id="modalSubjectId">
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">ประเภทลิงก์</label>
                    <select id="modalLinkType" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                        <option value="summary">📝 สรุปเนื้อหา / เลกเชอร์</option>
                        <option value="exam">🎯 ข้อสอบ / แบบฝึกหัด / ควิซ</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">ชื่อหัวข้อ / คำอธิบาย</label>
                    <input id="modalLinkTitle" type="text" placeholder="เช่น สรุปบทที่ 1, ตะลุยโจทย์ปลายภาค" 
                           class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">URL ปลายทาง (Google Drive, Canva, Notion ฯลฯ)</label>
                    <input id="modalLinkUrl" type="url" placeholder="https://..." 
                           class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal()" class="px-4 py-2.5 text-sm text-slate-600 hover:bg-slate-100 rounded-xl font-medium">ยกเลิก</button>
                <button onclick="saveLink()" class="px-5 py-2.5 text-sm bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-medium shadow-sm">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <!-- Modal 3: จัดการและแก้ไขชั้นปี -->
    <div id="categoryModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-3xl max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-900">⚙️ จัดการ & แก้ไขชั้นปี</h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            
            <div class="flex gap-2">
                <input id="customCategoryInput" type="text" placeholder="เพิ่มปีใหม่ เช่น ปี 1 เทอม 1..." 
                       class="flex-1 px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addNewCategory()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">
                    เพิ่ม
                </button>
            </div>

            <p class="text-[11px] text-slate-400">💡 แตะ ✏️ เพื่อเปลี่ยนชื่อชั้นปี หรือแตะค้าง ☰ เพื่อลากเรียงลำดับ</p>

            <div class="space-y-1.5 max-h-60 overflow-y-auto pr-1" id="categoryManagerList">
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="closeCategoryModal()" class="px-5 py-2.5 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium">
                    ปิดหน้าต่าง
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 4: แก้ไขชื่อวิชา -->
    <div id="editSubjectModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-3xl max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-900">✏️ แก้ไขชื่อวิชา & ชั้นปี</h3>
                <button onclick="closeEditSubjectModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            <input type="hidden" id="editSubjectId">
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">ชั้นปี / หมวดหมู่</label>
                    <select id="editSubjectCategory" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50">
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">ชื่อวิชา / หัวข้อ</label>
                    <input id="editSubjectName" type="text" placeholder="ระบุชื่อวิชา..." 
                           class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeEditSubjectModal()" class="px-4 py-2.5 text-sm text-slate-600 hover:bg-slate-100 rounded-xl font-medium">ยกเลิก</button>
                <button onclick="saveEditSubject()" class="px-5 py-2.5 text-sm bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-medium shadow-sm">บันทึกการแก้ไข</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyY7M6fdlwe0ed5ULzGasGz55jFfohm9JhtA08lf4ZlygUoV61czcMuTWAcmm6fbATO/exec";

        let categories = ['ปี 1', 'ปี 2', 'ปี 3', 'ปี 4', 'วิชาทั่วไป'];
        let subjects = [];
        let currentFilter = 'ทั้งหมด';

        function updateSyncStatus(status, text) {
            const el = document.getElementById('syncStatus');
            if (status === 'syncing') {
                el.className = "flex items-center gap-1.5 text-[11px] text-amber-600 font-medium";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span> ${text}`;
            } else if (status === 'success') {
                el.className = "flex items-center gap-1.5 text-[11px] text-emerald-600 font-medium";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> ${text}`;
            } else {
                el.className = "flex items-center gap-1.5 text-[11px] text-rose-600 font-medium";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> ${text}`;
            }
        }

        async function loadDataFromGoogleDrive() {
            try {
                updateSyncStatus('syncing', 'กำลังโหลดข้อมูลจาก Google Drive...');
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();
                
                if (data.categories && data.categories.length > 0) categories = data.categories;
                if (data.subjects) subjects = data.subjects;

                updateSyncStatus('success', 'เชื่อมต่อกับ Google Drive สำเร็จ');
                render();
            } catch (err) {
                console.error(err);
                updateSyncStatus('error', 'โหลดข้อมูลล้มเหลว (ใช้ออฟไลน์)');
                categories = JSON.parse(localStorage.getItem('study_vault_categories')) || categories;
                subjects = JSON.parse(localStorage.getItem('study_vault_v4')) || [];
                render();
            }
        }

        async function saveData() {
            localStorage.setItem('study_vault_categories', JSON.stringify(categories));
            localStorage.setItem('study_vault_v4', JSON.stringify(subjects));

            try {
                updateSyncStatus('syncing', 'กำลังบันทึกลง Google Drive...');
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ categories, subjects })
                });
                updateSyncStatus('success', 'บันทึกลง Google Drive แล้ว');
            } catch (err) {
                console.error(err);
                updateSyncStatus('error', 'เกิดข้อผิดพลาดในการบันทึก');
            }
        }

        // --- เพิ่มวิชาใหม่ผ่าน Modal ---
        function openAddSubjectModal() {
            const select = document.getElementById('modalAddSubjectCategory');
            select.innerHTML = categories.map(cat => `<option value="${cat}">📌 ${cat}</option>`).join('');
            if (currentFilter !== 'ทั้งหมด' && categories.includes(currentFilter)) {
                select.value = currentFilter;
            }
            document.getElementById('modalAddSubjectName').value = '';
            document.getElementById('addSubjectModal').classList.remove('hidden');
            document.getElementById('addSubjectModal').classList.add('flex');
        }

        function closeAddSubjectModal() {
            document.getElementById('addSubjectModal').classList.add('hidden');
            document.getElementById('addSubjectModal').classList.remove('flex');
        }

        function confirmAddSubject() {
            const name = document.getElementById('modalAddSubjectName').value.trim();
            const category = document.getElementById('modalAddSubjectCategory').value || (categories[0] || 'ทั่วไป');

            if (!name) {
                alert('กรุณากรอกชื่อวิชา');
                return;
            }

            subjects.unshift({
                id: "sub_" + Date.now().toString(),
                category: category,
                name: name,
                summaries: [],
                exams: []
            });

            saveData();
            render();
            closeAddSubjectModal();
        }

        // --- จัดการชั้นปี ---
        function openCategoryModal() {
            document.getElementById('customCategoryInput').value = '';
            renderCategoryManagerList();
            document.getElementById('categoryModal').classList.remove('hidden');
            document.getElementById('categoryModal').classList.add('flex');
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.add('hidden');
            document.getElementById('categoryModal').classList.remove('flex');
            render();
        }

        function addNewCategory() {
            const input = document.getElementById('customCategoryInput');
            const name = input.value.trim();
            if (!name) return;
            if (categories.includes(name)) {
                alert('มีชื่อชั้นปี/หมวดหมู่นี้อยู่แล้ว');
                return;
            }
            categories.push(name);
            input.value = '';
            saveData();
            renderCategoryManagerList();
        }

        function editCategoryName(oldName) {
            const newName = prompt(`แก้ไขชื่อ "${oldName}" เป็น:`, oldName);
            if (!newName || newName.trim() === "" || newName.trim() === oldName) return;

            const trimmedName = newName.trim();
            if (categories.includes(trimmedName)) {
                alert('มีชื่อนี้อยู่แล้ว');
                return;
            }

            const index = categories.indexOf(oldName);
            if (index !== -1) categories[index] = trimmedName;

            subjects.forEach(sub => {
                if (sub.category === oldName) sub.category = trimmedName;
            });

            if (currentFilter === oldName) currentFilter = trimmedName;

            saveData();
            renderCategoryManagerList();
        }

        function deleteCategory(catName) {
            if (confirm(`ต้องการลบ "${catName}" ใช่หรือไม่?\n(วิชาในหมวดนี้จะถูกย้ายไปชั้นปีแรก)`)) {
                categories = categories.filter(c => c !== catName);
                subjects.forEach(sub => {
                    if (sub.category === catName) sub.category = categories[0] || 'ทั่วไป';
                });
                if (currentFilter === catName) currentFilter = 'ทั้งหมด';
                saveData();
                renderCategoryManagerList();
            }
        }

        function renderCategoryManagerList() {
            const list = document.getElementById('categoryManagerList');
            if (categories.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 italic py-2 text-center">ยังไม่มีชั้นปี เพิ่มด้านบนได้เลย</p>`;
                return;
            }
            list.innerHTML = categories.map((cat) => `
                <div data-id="${cat}" class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                    <div class="flex items-center gap-2 truncate flex-1">
                        <span class="drag-handle text-slate-400 hover:text-indigo-600 px-1 py-0.5 select-none text-base">☰</span>
                        <span class="font-medium text-slate-700 truncate">🎓 ${cat}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="editCategoryName('${cat}')" class="text-slate-500 hover:bg-slate-200 p-1.5 rounded-lg text-xs" title="แก้ไขชื่อ">✏️</button>
                        <button onclick="deleteCategory('${cat}')" class="text-rose-500 hover:bg-rose-50 px-2 py-1 rounded text-xs font-medium">ลบ</button>
                    </div>
                </div>
            `).join('');

            new Sortable(list, {
                handle: '.drag-handle',
                animation: 200,
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    const newOrder = Array.from(list.children).map(item => item.getAttribute('data-id'));
                    categories = newOrder.filter(Boolean);
                    saveData();
                }
            });
        }

        // --- แก้ไขวิชา ---
        function openEditSubjectModal(subjectId) {
            const subject = subjects.find(s => s.id === subjectId);
            if (!subject) return;

            document.getElementById('editSubjectId').value = subject.id;
            document.getElementById('editSubjectName').value = subject.name;

            const editCatSelect = document.getElementById('editSubjectCategory');
            editCatSelect.innerHTML = categories.map(cat => `
                <option value="${cat}" ${cat === subject.category ? 'selected' : ''}>🎓 ${cat}</option>
            `).join('');

            document.getElementById('editSubjectModal').classList.remove('hidden');
            document.getElementById('editSubjectModal').classList.add('flex');
        }

        function closeEditSubjectModal() {
            document.getElementById('editSubjectModal').classList.add('hidden');
            document.getElementById('editSubjectModal').classList.remove('flex');
        }

        function saveEditSubject() {
            const id = document.getElementById('editSubjectId').value;
            const newName = document.getElementById('editSubjectName').value.trim();
            const newCategory = document.getElementById('editSubjectCategory').value;

            if (!newName) {
                alert('กรุณากรอกชื่อวิชา');
                return;
            }

            const subject = subjects.find(s => s.id === id);
            if (subject) {
                subject.name = newName;
                subject.category = newCategory;
                saveData();
                render();
                closeEditSubjectModal();
            }
        }

        function deleteSubject(id) {
            if (confirm('คุณต้องการลบวิชานี้และข้อมูลลิงก์ทั้งหมดใช่หรือไม่?')) {
                subjects = subjects.filter(s => s.id !== id);
                saveData();
                render();
            }
        }

        // --- เพิ่ม/ลบลิงก์ ---
        function openAddLinkModal(subjectId) {
            document.getElementById('modalSubjectId').value = subjectId;
            document.getElementById('modalLinkTitle').value = '';
            document.getElementById('modalLinkUrl').value = '';
            document.getElementById('linkModal').classList.remove('hidden');
            document.getElementById('linkModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('linkModal').classList.add('hidden');
            document.getElementById('linkModal').classList.remove('flex');
        }

        function saveLink() {
            const id = document.getElementById('modalSubjectId').value;
            const type = document.getElementById('modalLinkType').value;
            const title = document.getElementById('modalLinkTitle').value.trim();
            let url = document.getElementById('modalLinkUrl').value.trim();

            if (!title || !url) {
                alert('กรุณากรอกชื่อและ URL ให้ครบถ้วน');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const subject = subjects.find(s => s.id === id);
            if (subject) {
                if (!subject.summaries) subject.summaries = [];
                if (!subject.exams) subject.exams = [];

                if (type === 'summary') {
                    subject.summaries.push({ title, url });
                } else {
                    subject.exams.push({ title, url });
                }
                saveData();
                render();
                closeModal();
            }
        }

        function deleteLink(subjectId, type, index) {
            const subject = subjects.find(s => s.id === subjectId);
            if (subject) {
                if (type === 'summary') subject.summaries.splice(index, 1);
                if (type === 'exam') subject.exams.splice(index, 1);
                saveData();
                render();
            }
        }

        function setFilter(cat) {
            currentFilter = cat;
            render();
        }

        // --- Render หน้าจอหลัก ---
        function render() {
            // 1. Render แถบเลือกชั้นปี (Year Tabs)
            const yearTabBar = document.getElementById('yearTabBar');
            const allFilters = ['ทั้งหมด', ...categories];
            yearTabBar.innerHTML = allFilters.map(cat => {
                const isActive = currentFilter === cat;
                return `
                    <button onclick="setFilter('${cat}')" 
                            class="px-4 py-2 rounded-xl text-xs md:text-sm font-semibold whitespace-nowrap transition flex items-center gap-1.5 ${
                                isActive 
                                ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-200' 
                                : 'bg-slate-50 text-slate-600 hover:bg-slate-100'
                            }">
                        <span>${cat === 'ทั้งหมด' ? '🌐' : '🎓'}</span> ${cat}
                    </button>
                `;
            }).join('');

            // 2. ค้นหา & กรองตามชั้นปี
            const searchKeyword = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
            
            let filteredSubjects = currentFilter === 'ทั้งหมด' 
                ? subjects 
                : subjects.filter(s => s.category === currentFilter);

            if (searchKeyword) {
                filteredSubjects = filteredSubjects.filter(sub => {
                    const matchName = sub.name.toLowerCase().includes(searchKeyword);
                    const matchSummary = (sub.summaries || []).some(s => s.title.toLowerCase().includes(searchKeyword));
                    const matchExam = (sub.exams || []).some(e => e.title.toLowerCase().includes(searchKeyword));
                    return matchName || matchSummary || matchExam;
                });
            }

            // 3. Render สถิติสรุป
            let totalSummaries = 0, totalExams = 0;
            filteredSubjects.forEach(s => {
                totalSummaries += (s.summaries || []).length;
                totalExams += (s.exams || []).length;
            });
            document.getElementById('statsSummary').innerHTML = `
                <span>📚 <b>${filteredSubjects.length}</b> วิชา</span>
                <span>•</span>
                <span class="text-emerald-600">📝 <b>${totalSummaries}</b> สรุป</span>
                <span>•</span>
                <span class="text-amber-600">🎯 <b>${totalExams}</b> ข้อสอบ</span>
            `;

            // 4. Render การ์ดรายวิชา
            const container = document.getElementById('subjectList');
            if (filteredSubjects.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-3xl border border-dashed border-slate-200 p-8">
                        <p class="text-3xl mb-2">📂</p>
                        <p class="text-slate-600 font-semibold">ไม่พบรายวิชาในส่วนนี้</p>
                        <p class="text-xs text-slate-400 mt-1">กดปุ่ม "+ เพิ่มวิชาใหม่" ด้านบนเพื่อเริ่มบันทึกเนื้อหา</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredSubjects.map((sub) => `
                <div data-id="${sub.id}" class="subject-card bg-white rounded-3xl shadow-xs border border-slate-200 overflow-hidden transition hover:shadow-md">
                    <!-- หัวการ์ดวิชา -->
                    <div class="p-4 bg-slate-50/70 border-b border-slate-200/80 flex flex-wrap justify-between items-center gap-2">
                        <div class="flex items-center gap-2.5 flex-1 cursor-pointer" onclick="openEditSubjectModal('${sub.id}')">
                            <span class="subject-handle drag-handle text-slate-400 hover:text-indigo-600 px-1 py-0.5 select-none text-lg" onclick="event.stopPropagation()">☰</span>
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-100/80">
                                🎓 ${sub.category || 'ทั่วไป'}
                            </span>
                            <h2 class="font-bold text-sm md:text-base text-slate-900 hover:text-indigo-600 transition flex items-center gap-1.5">
                                ${sub.name} <span class="text-xs text-slate-400 font-normal">✏️</span>
                            </h2>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="openAddLinkModal('${sub.id}')" 
                                    class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3 py-1.5 rounded-xl flex items-center gap-1 shadow-2xs transition">
                                <span>+</span> เพิ่มลิงก์
                            </button>
                            <button onclick="openEditSubjectModal('${sub.id}')" 
                                    class="text-xs text-slate-500 hover:text-indigo-600 hover:bg-slate-200/60 p-1.5 rounded-lg transition" title="แก้ไข">
                                ✏️
                            </button>
                            <button onclick="deleteSubject('${sub.id}')" 
                                    class="text-xs text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition" title="ลบ">
                                🗑️
                            </button>
                        </div>
                    </div>
                    
                    <!-- ส่วนเนื้อหา: สรุป & ข้อสอบ -->
                    <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- กล่องสรุปเนื้อหา -->
                        <div class="bg-emerald-50/30 p-3.5 rounded-2xl border border-emerald-100/80 space-y-2.5">
                            <div class="flex items-center justify-between text-xs font-bold text-emerald-800">
                                <span class="flex items-center gap-1.5">📝 สรุปเนื้อหา & เลกเชอร์</span>
                                <span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-[10px] font-semibold">${(sub.summaries || []).length}</span>
                            </div>
                            <div id="summaries_${sub.id}" class="space-y-1.5">
                                ${(sub.summaries && sub.summaries.length) ? sub.summaries.map((item, idx) => `
                                    <div data-index="${idx}" class="flex items-center justify-between p-2.5 rounded-xl bg-white hover:bg-emerald-50/50 border border-slate-200/80 transition shadow-2xs gap-1.5">
                                        <span class="link-handle drag-handle text-slate-300 hover:text-emerald-600 px-1 select-none text-xs">☰</span>
                                        <a href="${item.url}" target="_blank" class="text-xs md:text-sm text-slate-800 hover:text-emerald-700 truncate flex-1 font-medium">
                                            📄 ${item.title}
                                        </a>
                                        <button onclick="deleteLink('${sub.id}', 'summary', ${idx})" class="text-slate-300 hover:text-rose-500 ml-1 text-xs px-1">✕</button>
                                    </div>
                                `).join('') : '<p class="text-xs text-slate-400 italic py-2 text-center">ยังไม่มีลิงก์สรุป</p>'}
                            </div>
                        </div>

                        <!-- กล่องข้อสอบ -->
                        <div class="bg-amber-50/30 p-3.5 rounded-2xl border border-amber-100/80 space-y-2.5">
                            <div class="flex items-center justify-between text-xs font-bold text-amber-800">
                                <span class="flex items-center gap-1.5">🎯 ข้อสอบ & แบบฝึกหัด</span>
                                <span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full text-[10px] font-semibold">${(sub.exams || []).length}</span>
                            </div>
                            <div id="exams_${sub.id}" class="space-y-1.5">
                                ${(sub.exams && sub.exams.length) ? sub.exams.map((item, idx) => `
                                    <div data-index="${idx}" class="flex items-center justify-between p-2.5 rounded-xl bg-white hover:bg-amber-50/50 border border-slate-200/80 transition shadow-2xs gap-1.5">
                                        <span class="link-handle drag-handle text-slate-300 hover:text-amber-600 px-1 select-none text-xs">☰</span>
                                        <a href="${item.url}" target="_blank" class="text-xs md:text-sm text-slate-800 hover:text-amber-800 truncate flex-1 font-medium">
                                            ✏️ ${item.title}
                                        </a>
                                        <button onclick="deleteLink('${sub.id}', 'exam', ${idx})" class="text-slate-300 hover:text-rose-500 ml-1 text-xs px-1">✕</button>
                                    </div>
                                `).join('') : '<p class="text-xs text-slate-400 italic py-2 text-center">ยังไม่มีลิงก์ข้อสอบ</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Sortable จัดลำดับวิชา
            new Sortable(container, {
                handle: '.subject-handle',
                animation: 200,
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    const orderedIds = Array.from(container.children).map(c => c.getAttribute('data-id'));
                    if (currentFilter === 'ทั้งหมด') {
                        subjects.sort((a, b) => orderedIds.indexOf(a.id) - orderedIds.indexOf(b.id));
                    }
                    saveData();
                }
            });

            // Sortable จัดลำดับลิงก์สรุป & ข้อสอบ
            filteredSubjects.forEach(sub => {
                const sumContainer = document.getElementById(`summaries_${sub.id}`);
                if (sumContainer) {
                    new Sortable(sumContainer, {
                        handle: '.link-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: function () {
                            const newIndices = Array.from(sumContainer.children).map(c => parseInt(c.getAttribute('data-index')));
                            sub.summaries = newIndices.map(i => sub.summaries[i]).filter(Boolean);
                            saveData();
                        }
                    });
                }

                const examContainer = document.getElementById(`exams_${sub.id}`);
                if (examContainer) {
                    new Sortable(examContainer, {
                        handle: '.link-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: function () {
                            const newIndices = Array.from(examContainer.children).map(c => parseInt(c.getAttribute('data-index')));
                            sub.exams = newIndices.map(i => sub.exams[i]).filter(Boolean);
                            saveData();
                        }
                    });
                }
            });
        }

        // เริ่มโหลดข้อมูลจาก Google Drive ทันที
        loadDataFromGoogleDrive();
    </script>
</body>
</html>
